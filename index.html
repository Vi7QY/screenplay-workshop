<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>剧本工坊 - 专业短剧编剧写作工具</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    #mobile-tip{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#0d0d18;color:#e0e0f0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
    #mobile-tip .icon{font-size:48px;margin-bottom:20px}
    #mobile-tip h2{font-size:20px;font-weight:700;margin-bottom:12px;color:#7c5ce7}
    #mobile-tip p{font-size:14px;line-height:1.8;color:#8888a8;margin-bottom:24px;max-width:320px}
    #mobile-tip .btn{padding:10px 28px;font-size:14px;background:#7c5ce7;color:#fff;border:none;border-radius:8px;cursor:pointer}
    #mobile-tip .btn-ghost{padding:10px 28px;font-size:13px;background:transparent;color:#555570;border:1px solid #333;border-radius:8px;cursor:pointer;margin-top:10px}
    @media(max-width:768px){#mobile-tip{display:flex}}
  </style>
</head>
<body>
  <div id="mobile-tip">
    <div class="icon">✎</div>
    <h2>剧本工坊</h2>
    <p>本工具为桌面端设计，包含多栏编辑器、快捷键和结构化写作功能，建议使用电脑浏览器打开以获得最佳体验。</p>
    <button class="btn" onclick="window.location.href='mailto:?subject=%E5%89%A7%E6%9C%AC%E5%B7%A5%E5%9D%8A&body=%E5%89%A7%E6%9C%AC%E5%B7%A5%E5%9D%8A%E5%9C%A8%E7%BA%BF%E5%9C%B0%E5%9D%80%EF%BC%9Ahttps://vi7qy.github.io/screenplay-workshop/'">发送链接到邮箱</button>
    <button class="btn-ghost" onclick="document.getElementById('mobile-tip').style.display='none'">我知道了，继续使用</button>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
